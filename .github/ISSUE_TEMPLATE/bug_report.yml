name: Bug report
description: Something in the console doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove API keys, secrets, phone numbers and hostnames before pasting. Security problems go through SECURITY.md, not here.
  - type: textarea
    id: what
    attributes: { label: What happened, description: "And what you expected instead." }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Console version, description: Commit hash or "latest main". }
  - type: dropdown
    id: run
    attributes:
      label: How you run it
      options: [Docker, "npm start", "deploy.sh on a VM", Other]
  - type: input
    id: livekit
    attributes: { label: LiveKit server version }
  - type: textarea
    id: logs
    attributes: { label: Logs or screenshots, render: shell }
