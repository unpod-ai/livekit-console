name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What are you trying to do, description: "The problem, not just the solution." }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: What would you like to see }
  - type: textarea
    id: cloud
    attributes: { label: Is this in LiveKit Cloud's dashboard?, description: "Link or describe it. Note that some Cloud data isn't available from a self-hosted server." }
